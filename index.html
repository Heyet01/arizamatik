<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<title>Arızamatik</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{--asphalt:#16324F;--amber:#F2A900;--paper:#F5F7F6;--card:#fff;--ink:#14202B;--steel:#5B6B7A;--line:#DCE2E6;--red:#D6362F;--green:#1E8A5A;--soft:#E9EEF1}
@media (prefers-color-scheme:dark){:root{--paper:#0F1A24;--card:#172533;--ink:#E8EEF2;--steel:#98A8B6;--line:#2A3B4B;--soft:#1E2F3F;--asphalt:#0B2238}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh}
.top{background:var(--asphalt);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:25px}
.mark{width:28px;height:28px;background:var(--amber);color:#16324F;display:grid;place-items:center;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);font-size:14px}
.back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);font-size:22px;color:#fff}
.ttl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px}
.loc{margin-left:auto;font-size:13px;opacity:.85}
main{padding:16px 16px 96px}
.hero{background:var(--asphalt);color:#fff;margin:-16px -16px 0;padding:8px 16px 22px}
.hero h1{font-family:"Barlow Condensed",sans-serif;font-size:36px;line-height:1;margin-bottom:12px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:#cfdbe5}
.seg button.on{background:var(--amber);color:#16324F}
.ask{display:flex;background:#fff;border-radius:14px;padding:6px 6px 6px 14px;gap:8px}
.ask input{flex:1;border:0;background:transparent;color:#14202B;min-width:0}
.ask input:focus{outline:none}
.ask button,.btn{background:var(--amber);color:#16324F;font-weight:700;padding:11px 14px;border-radius:10px}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--asphalt) 14px 28px);margin:0 -16px 16px}
.sos{width:100%;display:flex;gap:14px;align-items:center;background:var(--red);color:#fff;border-radius:16px;padding:15px;text-align:left;margin-bottom:20px}
.sos b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:22px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:13px;font-weight:600;text-align:center}
.cat i{display:block;font-style:normal;font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.pro{display:flex;gap:12px;width:100%;text-align:left}
.av{width:48px;height:48px;border-radius:12px;background:var(--asphalt);color:var(--amber);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;flex:none}
.muted{color:var(--steel);font-size:14px}
.star{color:#c98c00;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{display:block;width:100%;text-align:center;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.acts a,.acts button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.tr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border:0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px}
.chk.on{background:var(--asphalt);color:#fff;border-color:var(--asphalt)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);padding:9px;border-radius:10px;font-weight:600}
.tabs button.on{background:var(--amber);color:#16324F;border-color:var(--amber)}
.tip{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--soft)}
.empty{text-align:center;padding:30px 10px;color:var(--steel)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--steel)}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--ink)}
.stars{display:flex;gap:6px;margin:6px 0 4px}
.stars button{font-size:42px;color:var(--line);line-height:1}
.stars button.on{color:#F2A900}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.bub{align-self:flex-start;max-width:82%;background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:14px;border-bottom-left-radius:4px;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--asphalt);color:#fff;border-color:var(--asphalt);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.composer{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:8px;padding:8px 12px;background:var(--paper);border-top:1px solid var(--line);z-index:6}
.badge.warn{background:rgba(242,169,0,.22);color:#8a5d00}
.badge.bad{background:rgba(214,54,47,.15);color:var(--red)}
.gallery{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.gallery img{height:150px;border-radius:12px;flex:none;object-fit:cover;max-width:80%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs div{position:relative}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 6px;font-size:13px}
.jobimg{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:28px;line-height:1}
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.plan.best{border:2px solid var(--amber)}
.plan h3{font-family:"Barlow Condensed",sans-serif;font-size:26px;line-height:1}
.plan .price{font-family:"Barlow Condensed",sans-serif;font-size:32px;color:var(--asphalt)}
@media (prefers-color-scheme:dark){.plan .price{color:var(--amber)}}
.plan ul{padding-left:18px;margin:8px 0;font-size:14px}
.plan li{margin-bottom:4px}
.camp{background:rgba(242,169,0,.18);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;margin-top:4px;display:inline-block}
.feat{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.feat .card{flex:none;width:210px;margin:0}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:1px}
.legal p,.legal li{margin-bottom:8px;font-size:15px}
.legal ul{padding-left:20px}
.linkbtn{color:var(--steel);text-decoration:underline;font-size:14px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
  <nav id="nav">
    <button data-n="home" class="on"><i>🏠</i>Ana sayfa</button>
    <button data-n="stations"><i>📍</i>Yakınımda</button>
    <button data-n="jobs"><i>🧾</i>Taleplerim</button>
    <button data-n="garage"><i>🔔</i>Garaj & Ev</button>
    <button data-n="account"><i>👤</i>Hesabım</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ AYARLAR: Supabase bilgilerini buraya yapistir ============ */
const SUPABASE_URL = 'https://gpgygbrhplsvgjxmunhw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pfn9eXTbZ0WQKjQdv5Z_pg_lAwIu3uS';
/* ======================================================================= */

const S = { role:'user', city:(()=>{ try { return localStorage.getItem('city') || ''; } catch(e) { return ''; } })(), user:null, mode:'arac', cats:[], lat:41.0082, lng:28.9784, locOk:false, stack:[], cur:null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl = n => n == null ? '' : Number(n).toLocaleString('tr-TR') + ' ₺';
const toast = m => { const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3000); };
const point = () => `SRID=4326;POINT(${S.lng} ${S.lat})`;
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

const configured = !SUPABASE_URL.includes('BURAYA') && !SUPABASE_KEY.includes('BURAYA');
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ---------- Hizli yonlendirme (yapay zeka asistani sonraki adimda) ---------- */
const RULES = [
  {k:['hararet','ısın','radyatör','su kaynat'],slug:'mekanik',t:'Motor aşırı ısınıyor olabilir',tip:'Aracı güvenli yerde durdur, motoru kapat. Motor sıcakken radyatör kapağını açma.'},
  {k:['fren','balata'],slug:'mekanik',t:'Fren sistemi sorunu olabilir',tip:'Fren şüphesi varsa aracı kullanma, çekici çağır.'},
  {k:['motor','yağ','duman','ses'],slug:'mekanik',t:'Mekanik bir arıza olabilir',tip:'Arıza lambası yanıyorsa uzun yol yapmadan ustaya göster.'},
  {k:['lastik','patla','teker','inik'],slug:'lastik',t:'Lastik sorunu',tip:'Dörtlüleri yak, emniyet şeridine çek. Trafik akarken yol tarafında lastik değiştirme.'},
  {k:['akü','marş','çalışmıyor','kontak'],slug:'oto-elektrik',t:'Akü veya marş sorunu olabilir',tip:'Takviye kablosunu yanlış bağlamak elektroniğe zarar verebilir.'},
  {k:['kaza','göçük','çizik','boya'],slug:'kaporta',t:'Kaporta hasarı',tip:'Yaralanma varsa önce 112\'yi ara.'},
  {k:['cam','kırıl'],slug:'oto-cam',t:'Cam hasarı',tip:'Çatlak büyümeden değiştirmek daha ucuza gelir.'},
  {k:['su gelmiyor','musluk','sızıntı','kaçak','tıkan','gider','petek','boru'],slug:'su-tesisat',t:'Su tesisatı arızası',tip:'Kaçak varsa ana su vanasını kapat, suyun prizlere ulaşmasını engelle.'},
  {k:['sigorta','elektrik','priz','kısa devre','ışık'],slug:'elektrik',t:'Elektrik arızası',tip:'Yanık kokusu veya kıvılcım varsa ana şalteri kapat. Panoyu kendin açma.'},
  {k:['buzdolabı','çamaşır','bulaşık','fırın'],slug:'beyaz-esya',t:'Beyaz eşya arızası',tip:'Cihazın fişini çekmeden içine müdahale etme.'},
  {k:['kombi','doğalgaz','gaz kokusu','sıcak su'],slug:'kombi',t:'Kombi / doğalgaz sorunu',tip:'Gaz kokusu varsa elektrik düğmelerine dokunma, vanayı kapat, havalandır ve 187\'yi ara.'},
  {k:['klima'],slug:'klima',t:'Klima arızası',tip:'Filtreyi kontrol edebilirsin, iç aksama dokunma.'},
  {k:['kapı','anahtar','kilit'],slug:'cilingir',t:'Kilit / kapı sorunu',tip:'Çilingir kimlik doğrulaması isteyebilir.'}
];

/* ---------- Navigasyon ---------- */
function go(name, arg, push=true){
  if (S.channel) { db.removeChannel(S.channel); S.channel = null; }
  if (push && S.cur) S.stack.push([S.cur.name, S.cur.arg]);
  S.cur = {name, arg};
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.n === name));
  window.scrollTo(0,0);
  SCREENS[name](arg);
}
function back(){ const p = S.stack.pop(); p ? go(p[0], p[1], false) : go('home', null, false); }
function header(title){
  $('top').innerHTML = title
    ? `<button class="back" onclick="back()" aria-label="Geri">‹</button><span class="ttl">${esc(title)}</span>`
    : `<div class="logo"><span class="mark">A</span>Arızamatik</div><span class="loc">${S.locOk?'📍 Konumun açık':'📍 Konum kapalı'}</span>`;
}
$('nav').onclick = e => { const b=e.target.closest('[data-n]'); if(!b) return; S.stack=[]; go(b.dataset.n, null, false); };
function needLogin(){ if (S.user) return false; toast('Bu işlem için giriş yapmalısın'); go('login'); return true; }
const catBySlug = s => S.cats.find(c => c.slug === s);

/* ---------- Ekranlar ---------- */
const SCREENS = {
  home(){
    header();
    const cats = S.cats.filter(c => c.grp === S.mode);
    $('view').innerHTML = `
      <div class="hero">
        <h1>Ne arızalandı?</h1>
        <div class="seg"><button class="${S.mode==='arac'?'on':''}" onclick="S.mode='arac';go('home',null,false)">🚗 Aracım</button><button class="${S.mode==='ev'?'on':''}" onclick="S.mode='ev';go('home',null,false)">🏠 Evim</button></div>
        <div class="ask"><input id="q" placeholder="${S.mode==='arac'?'Örn: araç hararet yaptı':'Örn: evde su gelmiyor'}"><button onclick="diagnose()">Sor</button></div>
        <div id="dg"></div>
      </div>
      <div class="stripe"></div>
      <div id="rem"></div>
      <div id="feat"></div>
      ${S.mode==='arac'?`<button class="sos" onclick="go('tow')"><span style="font-size:30px">🚨</span><span><b>Yolda kaldım</b>En yakın çekici ve yol yardımı</span></button>`:''}
      <h2>Kategoriler</h2>
      <div class="grid">${cats.map(c=>`<button class="cat" onclick="go('list','${c.slug}')"><i>${c.icon||'🔧'}</i>${esc(c.name)}</button>`).join('') || '<p class="muted">Kategoriler yükleniyor…</p>'}</div>
      <div class="card"><b>Usta mısın?</b><p class="muted">İşletmeni ücretsiz ekle, yakınındaki müşteriler seni bulsun.</p><button class="btn" onclick="go('addBiz')">İşletmemi ekle</button></div>`;
    $('q').onkeydown = e => { if (e.key==='Enter') diagnose(); };
    loadReminders(); loadFeatured();
  },

  async list(slug){
    const cat = catBySlug(slug); header(cat ? cat.name : 'Ustalar');
    if (!S.locOk) await getLocation();
    const byCity = !S.locOk && S.city;
    const cityForm = `<div class="card"><b>📍 Konum izni kapalı</b><p class="muted">Şehrini yazarak ara ya da tarayıcı ayarlarından konum izni ver.</p>
      <div class="row" style="margin-top:8px"><input class="in" id="cityIn" placeholder="Örn: Konya" value="${esc(S.city)}"><button class="btn" id="cityGo" style="width:auto;margin:0">Ara</button></div></div>`;
    if (!S.locOk && !S.city) {
      $('view').innerHTML = cityForm;
    } else {
      $('view').innerHTML = `<p class="muted">Ustalar aranıyor…</p>`;
      const { data, error } = byCity
        ? await db.rpc('providers_by_city', { city_name:S.city, category_slug:slug })
        : await db.rpc('nearby_providers', { lat:S.lat, lng:S.lng, category_slug:slug, radius_km:50 });
      if (error) { $('view').innerHTML = `<div class="empty">Liste alınamadı: ${esc(error.message)}</div>`; return; }
      S.lastList = data;
      const sortBtns = byCity ? [['rate','En yüksek puan'],['price','En uygun']] : [['dist','En yakın'],['rate','En yüksek puan'],['price','En uygun']];
      const render = (mode) => {
        const arr = [...data].sort({dist:(a,b)=>a.distance_km-b.distance_km, rate:(a,b)=>b.rating_avg-a.rating_avg, price:(a,b)=>(a.min_price??1e9)-(b.min_price??1e9)}[mode]);
        $('view').innerHTML = `
          ${byCity ? cityForm : ''}
          <div class="tabs">${sortBtns.map(([k,n])=>`<button class="${k===mode?'on':''}" data-s="${k}">${n}</button>`).join('')}</div>
          ${arr.length ? arr.map(p=>`<button class="card pro" onclick="go('pro','${p.id}')">
            <div class="av">${esc(p.business_name[0])}</div>
            <div style="flex:1;min-width:0"><div class="row"><b>${esc(p.business_name)}</b>${p.plan_rank>0?'<span class="badge warn">⭐ Öne çıkan</span>':''}${p.is_verified?'<span class="badge">✔ Onaylı</span>':''}</div>
            <div class="muted">${p.distance_km!=null ? p.distance_km.toFixed(1)+' km · ' : ''}${esc(p.district||'')} ${p.is_24_7?'· 7/24':''}</div>
            ${p.campaign ? `<div class="camp">📣 ${esc(p.campaign)}</div>` : ''}
            <div class="row"><span class="star">★ ${Number(p.rating_avg).toFixed(1)} <span class="muted">(${p.rating_count})</span></span><b>${p.min_price!=null?tl(p.min_price)+"'den":''}</b></div></div>
          </button>`).join('')
          : `<div class="empty">${byCity ? esc(S.city) + ' için' : 'Bu bölgede'} henüz kayıtlı usta yok.<br>Tanıdığın bir usta varsa Arızamatik'i ona öner.</div>`}`;
        document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => render(b.dataset.s));
        bindCity();
      };
      render(sortBtns[0][0]);
    }
    function bindCity(){
      if (!$('cityGo')) return;
      const run = () => { const c = $('cityIn').value.trim(); if (!c) return toast('Şehir yaz'); S.city = c; try { localStorage.setItem('city', c); } catch(e) {} go('list', slug, false); };
      $('cityGo').onclick = run; $('cityIn').onkeydown = e => { if (e.key === 'Enter') run(); };
    }
    bindCity();
  },

  async pro(id){
    header('Usta profili');
    $('view').innerHTML = `<p class="muted">Yükleniyor…</p>`;
    const { data:p, error } = await db.from('providers')
      .select('id,owner_id,business_name,contact_name,description,phone,whatsapp,address,city,district,is_24_7,offers_mobile,is_verified,plan_code,plan_ends_at,campaign_text,rating_avg,rating_count,services(name,price_min,price_max,unit),working_hours(day_of_week,opens_at,closes_at,is_closed),provider_categories(category_id),provider_photos(url,created_at)')
      .eq('id', id).single();
    if (error) { $('view').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    await loadPlans();
    const plan = planOf(p);
    db.rpc('track_view', { pid:id });
    const { data:revs } = await db.from('reviews').select('rating,comment,created_at').eq('provider_id', id).order('created_at',{ascending:false}).limit(10);
    const near = (S.lastList||[]).find(x => x.id === id);
    const maps = near ? `https://www.google.com/maps/dir/?api=1&destination=${near.latitude},${near.longitude}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.address||'')+' '+(p.district||'')+' '+p.city)}`;
    const wa = p.whatsapp || p.phone;
    const isOwner = S.user && p.owner_id === S.user.id;
    $('view').innerHTML = `
      <div class="row" style="justify-content:flex-start;gap:14px"><div class="av" style="width:64px;height:64px">${esc(p.business_name[0])}</div>

  async chat(jobId){
    header('Mesajlar');
    if (!S.user) return go('login');
    $('view').innerHTML = `<p class="muted">Yükleniyor…</p>`;
    const { data:job, error } = await db.from('job_requests').select('id,user_id,description,providers(business_name)').eq('id', jobId).single();
    if (error) { $('view').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    header(job.user_id === S.user.id ? (job.providers?.business_name || 'Usta') : 'Müşteri');
    $('view').innerHTML = `${job.description?`<div class="tip">📝 ${esc(job.description)}</div><br>`:''}
      <div class="msgs" id="msgs"><p class="muted" id="noMsg">Henüz mesaj yok. İlk mesajı sen yaz.</p></div>
      <div class="composer"><input class="in" id="mIn" placeholder="Mesaj yaz…" aria-label="Mesaj yaz"><button class="btn" id="mSend" style="width:auto;margin:0">Gönder</button></div>`;
    const seen = new Set();
    const add = m => {
      if (!m || seen.has(m.id) || !$('msgs')) return; seen.add(m.id);
      $('noMsg')?.remove();
      const mine = m.sender_id === S.user.id;
      $('msgs').insertAdjacentHTML('beforeend', `<div class="bub ${mine?'me':''}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small></div>`);
      window.scrollTo(0, document.body.scrollHeight);
    };
    const { data:msgs } = await db.from('messages').select('*').eq('job_id', jobId).order('created_at');
    (msgs || []).forEach(add);
    S.channel = db.channel('msg-' + jobId)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`job_id=eq.${jobId}` }, pl => add(pl.new))
      .subscribe();
    const send = async () => {
      const body = $('mIn').value.trim(); if (!body) return;
      $('mIn').value = '';
      const { data:m, error } = await db.from('messages').insert({ job_id:jobId, sender_id:S.user.id, body }).select().single();
      if (error) { $('mIn').value = body; return toast('Gönderilemedi: ' + error.message); }
      add(m);
    };
    $('mSend').onclick = send;
    $('mIn').onkeydown = e => { if (e.key === 'Enter') send(); };
  },

      const { error } = id ? await db.from('vehicles').update(row).eq('id', id) : await db.from('vehicles').insert({ ...row, user_id:S.user.id });

        <label>Hizmet alanları (paketinle en fazla ${plan.category_limit})</label><div class="checks" id="e_cats">${S.cats.map(c => `<button class="chk ${sel.has(c.id)?'on':''}" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
        <label>Seçenekler</label><div class="checks"><button class="chk ${p.is_24_7?'on':''}" id="e_247">7/24 hizmet</button><button class="chk ${p.offers_mobile?'on':''}" id="e_mob">Yerinde servis</button></div>
        <button class="btn alt" id="e_loc">📍 Konumu şu anki yerimle güncelle</button>

      <div data-p="photos" style="display:none">
        <p class="muted">İş yerinin dışı, içi ve yaptığın işlerden fotoğraf ekle (paketine göre en fazla <b id="e_limit">${photoLimit(p)}</b> adet). Fotoğraflı ustalar daha çok güven veriyor.</p>
        <div class="thumbs" id="e_photos" style="margin:10px 0"></div>
        <label for="e_file" class="btn" style="cursor:pointer">📷 Fotoğraf ekle</label>
        <input id="e_file" type="file" accept="image/*" multiple style="display:none">
      </div>
      <button class="btn alt" onclick="go('pro','${p.id}')">👁️ Profilimi müşteri gözüyle gör</button>`;

    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b));
      document.querySelectorAll('[data-p]').forEach(x => x.style.display = x.dataset.p === b.dataset.t ? 'block' : 'none');
    });

    // Bilgiler
    $('e_cats').onclick = e => {
      const b = e.target.closest('[data-id]'); if (!b) return;
      const cid = +b.dataset.id;
      if (!sel.has(cid) && sel.size >= plan.category_limit) return toast(`Paketinle en fazla ${plan.category_limit} kategori seçebilirsin. Daha fazlası için paket yükselt.`);
      sel.has(cid) ? sel.delete(cid) : sel.add(cid); b.classList.toggle('on');
    };
    if (plan.has_stats) {
      db.rpc('provider_stats', { pid:p.id }).then(({ data:st, error }) => {
        if (!$('e_stats')) return;
        if (error) { $('e_stats').textContent = error.message; return; }
        $('e_stats').innerHTML = `<div class="stat">
          <div><b>${st.views_30d}</b><span class="muted">30 günde profil görüntülenme</span></div>
          <div><b>${st.requests_30d}</b><span class="muted">30 günde gelen talep</span></div>
          <div><b>${st.views_7d}</b><span class="muted">Son 7 gün görüntülenme</span></div>
          <div><b>${st.requests_7d}</b><span class="muted">Son 7 gün talep</span></div>
          <div><b>${st.completed}</b><span class="muted">Tamamlanan iş</span></div>
          <div><b>★ ${Number(st.rating).toFixed(1)}</b><span class="muted">${st.reviews} değerlendirme</span></div>
        </div><p class="muted">Profilin çok görüntülenip talep az geliyorsa fotoğraf ve fiyat listeni güçlendirmeyi dene.</p>`;
      });
    }
    ['e_247','e_mob'].forEach(x => $(x).onclick = e => e.currentTarget.classList.toggle('on'));
    let newLoc = null;
    $('e_loc').onclick = async () => { await getLocation(); if (!S.locOk) return toast('Konum izni gerekli'); newLoc = point(); $('e_loc').textContent = '📍 Yeni konum alındı, kaydetmeyi unutma'; };
    $('e_save').onclick = async () => {
      const v = x => $(x).value.trim();
      if (!v('e_name') || !v('e_phone') || !v('e_city')) return toast('İşletme adı, telefon ve şehir zorunlu');
      if (!sel.size) return toast('En az bir hizmet alanı seç');
      if (sel.size > plan.category_limit) return toast(`Paketinle en fazla ${plan.category_limit} kategori seçebilirsin`);
      const upd = { business_name:v('e_name'), contact_name:v('e_contact')||null, phone:v('e_phone'), whatsapp:v('e_wa')||null, city:v('e_city'), district:v('e_district')||null, address:v('e_addr')||null, description:v('e_desc')||null, is_24_7:$('e_247').classList.contains('on'), offers_mobile:$('e_mob').classList.contains('on') };
      if ($('e_camp')) upd.campaign_text = $('e_camp').value.trim() || null;
      if (newLoc) upd.location = newLoc;
      const { error } = await db.from('providers').update(upd).eq('id', p.id);
      if (error) return toast('Kaydedilemedi: ' + error.message);
      const oldCats = new Set(p.provider_categories.map(x => x.category_id));
      const toAdd = [...sel].filter(c => !oldCats.has(c));
      const toDel = [...oldCats].filter(c => !sel.has(c));
      if (toAdd.length) await db.from('provider_categories').insert(toAdd.map(category_id => ({ provider_id:p.id, category_id })));
      if (toDel.length) await db.from('provider_categories').delete().eq('provider_id', p.id).in('category_id', toDel);
      p.provider_categories = [...sel].map(category_id => ({ category_id }));
      $('n_cat').innerHTML = catOptions();
      newLoc = null; $('e_loc').textContent = '📍 Konumu şu anki yerimle güncelle';
      toast('Bilgiler kaydedildi');
    };

    // Fiyatlar
    let prices = p.services;
    const renderPrices = () => $('e_prices').innerHTML = prices.length
      ? [...prices].sort((a,b) => a.price_min - b.price_min).map(s => `<div class="tr"><span>${esc(s.name)}<br><b>${tl(s.price_min)}${s.price_max ? ' – ' + tl(s.price_max) : ''}</b></span><button class="chk" onclick="delPrice('${s.id}')">🗑️ Sil</button></div>`).join('')
      : '<span class="muted">Henüz fiyat eklemedin. Fiyatı olan ustalar daha çok tercih ediliyor.</span>';
    renderPrices();
    window.delPrice = async sid => {
      if (!confirm('Bu fiyatı silmek istiyor musun?')) return;
      const { error } = await db.from('services').delete().eq('id', sid);
      if (error) return toast(error.message);
      prices = prices.filter(s => s.id !== sid); renderPrices(); toast('Silindi');
    };
    $('n_add').onclick = async () => {
      const name = $('n_name').value.trim(), min = $('n_min').value, max = $('n_max').value, cat = $('n_cat').value;
      if (!name || !min) return toast('İş adı ve en az fiyatı yaz');
      if (!cat) return toast('Önce Bilgiler sekmesinde hizmet alanı seçip kaydet');
      if (plan.price_limit && prices.length >= plan.price_limit) return toast(`Ücretsiz üyelikte en fazla ${plan.price_limit} fiyat satırı olur. Sınırsız fiyat için paket al.`);
      if (max && Number(max) < Number(min)) return toast('En çok fiyat, en az fiyattan küçük olamaz');
      const { data:s, error } = await db.from('services').insert({ provider_id:p.id, category_id:Number(cat), name, price_min:Number(min), price_max:max ? Number(max) : null }).select('id,name,price_min,price_max,category_id').single();
      if (error) return toast('Eklenemedi: ' + error.message);
      prices.push(s); renderPrices(); ['n_name','n_min','n_max'].forEach(x => $(x).value = ''); toast('Fiyat eklendi');
    };

    // Fotograflar
    let photos = p.provider_photos.sort((a,b) => a.created_at.localeCompare(b.created_at));
    const renderPhotos = () => $('e_photos').innerHTML = photos.length
      ? photos.map(f => `<div><img src="${esc(f.url)}" alt="İşletme fotoğrafı" loading="lazy"><button onclick="delPhoto('${f.id}')" aria-label="Fotoğrafı sil">✕</button></div>`).join('')
      : '<span class="muted">Henüz fotoğraf yok</span>';
    renderPhotos();
    window.delPhoto = async pid => {
      const f = photos.find(x => x.id === pid); if (!f || !confirm('Bu fotoğrafı silmek istiyor musun?')) return;
      const { error } = await db.from('provider_photos').delete().eq('id', pid);
      if (error) return toast(error.message);
      await db.storage.from('photos').remove([f.path]);
      photos = photos.filter(x => x.id !== pid); renderPhotos(); toast('Fotoğraf silindi');
    };
    $('e_file').onchange = async e => {
      const limit = photoLimit(p);
      const files = [...e.target.files].slice(0, Math.max(0, limit - photos.length));
      e.target.value = '';
      if (!files.length) return toast(`Paketinle en fazla ${limit} fotoğraf ekleyebilirsin. Daha fazlası için paket yükselt.`);
      for (const file of files) {
        toast('Yükleniyor…');
        try {
          const up = await uploadPhoto(file);
          const { data:row, error } = await db.from('provider_photos').insert({ provider_id:p.id, path:up.path, url:up.url }).select('id,url,path,created_at').single();
          if (error) throw error;
          photos.push(row); renderPhotos();
        } catch (err) { toast('Yüklenemedi: ' + (err.message || err)); return; }
      }
      toast('Fotoğraflar eklendi');
    };

    // Saatler
    document.querySelectorAll('[data-closed]').forEach(b => b.onclick = () => b.classList.toggle('on'));
    $('h_save').onclick = async () => {
      const rows = order.map(d => {
        const closed = document.querySelector(`[data-closed="${d}"]`).classList.contains('on');
        return { provider_id:p.id, day_of_week:d, is_closed:closed, opens_at:closed ? null : ($('h_o'+d).value || null), closes_at:closed ? null : ($('h_c'+d).value || null) };
      });
      const { error } = await db.from('working_hours').upsert(rows, { onConflict:'provider_id,day_of_week' });
      error ? toast('Kaydedilemedi: ' + error.message) : toast('Çalışma saatleri kaydedildi');
    };
  },

        <ul>${pl.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
        <button class="btn" onclick="buyPlan('${pl.code}')">${esc(pl.name)} paketini al</button>
      </div>`).join('')}
      <h2>Ödeme geçmişin</h2>
      ${(subs||[]).length ? subs.map(s => `<div class="card"><div class="row"><b>${esc(S.plans.find(x=>x.code===s.plan_code)?.name || s.plan_code)}</b><span class="badge ${s.status==='pending'?'warn':''}">${SM[s.status]||s.status}</span></div>
        <div class="muted">${tl(s.amount)} · ${new Date(s.created_at).toLocaleDateString('tr-TR')} · Referans: <span class="ref">${esc(s.reference_code)}</span></div>
        ${s.status==='active' && s.ends_at ? `<div class="muted">Bitiş: ${new Date(s.ends_at).toLocaleDateString('tr-TR')}</div>` : ''}
        ${s.status==='pending' ? `<div class="tip">Ödemen bize ulaşınca paketin aktif olacak. Havale/EFT açıklamasına referans kodunu yazmayı unutma.</div>` : ''}</div>`).join('') : '<p class="muted">Henüz paket almadın.</p>'}`;
    if ($('p_biz')) $('p_biz').onchange = e => go('plans', e.target.value, false);
    window.buyPlan = async code => {
      const pl = S.plans.find(x => x.code === code);
      S.buy = { providerId:target.id, plan:pl };
      go('pay');
    };
  },

  async pay(){
    header('Ödeme');
    if (!S.user || !S.buy) return go('plans');
    const { plan, providerId } = S.buy;
    const { data:st } = await db.from('payment_settings').select('*').eq('id', true).single();
    const methods = [['havale','🏦 Havale'],['eft','🏦 EFT'],['banka_karti','💳 Banka kartı'],['kredi_karti','💳 Kredi kartı']];
    $('view').innerHTML = `
      <div class="card"><b>${esc(plan.name)}</b><div class="price">${tl(plan.price)}</div><div class="muted">${plan.duration_days} gün</div></div>
      <label>Ödeme yöntemi</label>
      <div class="checks" id="p_met">${methods.map(([k,n], i) => `<button class="chk ${i===0?'on':''}" data-m="${k}">${n}</button>`).join('')}</div>
      <div id="p_info"></div>
      <button class="btn" id="p_go">Ödeme talebi oluştur</button>
      <p class="muted" style="margin-top:8px">Talebi oluşturunca sana bir referans kodu vereceğiz. Ödemen hesabımıza geçtikten sonra paketin otomatik olarak süresi boyunca işletmene tanımlanır.</p>`;
    let method = 'havale';
    const info = () => {
      const bank = st && st.iban
        ? `<div class="card"><b>Hesap bilgileri</b>
            <div class="tr"><span>Ünvan</span><span>${esc(st.account_name || st.company_name)}</span></div>
            <div class="tr"><span>Banka</span><span>${esc(st.bank_name)}</span></div>
            <div class="tr"><span>IBAN</span><span class="ref">${esc(st.iban)}</span></div>
            ${st.instructions ? `<div class="muted" style="margin-top:6px">${esc(st.instructions)}</div>` : ''}</div>`
        : `<div class="tip">Banka hesap bilgileri henüz tanımlanmadı. Talebi oluştur, yönetici seninle iletişime geçip ödeme bilgilerini paylaşsın.</div>`;
      $('p_info').innerHTML = (method === 'havale' || method === 'eft')
        ? bank
        : (st && st.card_enabled
            ? `<div class="tip">Kart ile ödeme sayfasına yönlendirileceksin.</div>`
            : `<div class="tip">Kartla online ödeme altyapısı henüz aktif değil. Şimdilik talebi oluştur; yönetici sana kart ile ödeme bağlantısını iletsin ya da havale/EFT ile ödeyebilirsin.</div>`);
    };
    info();
    $('p_met').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; method = b.dataset.m; document.querySelectorAll('#p_met .chk').forEach(x => x.classList.toggle('on', x === b)); info(); };
    $('p_go').onclick = async () => {
      $('p_go').disabled = true;
      const ref = 'AR-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      const { error } = await db.from('subscriptions').insert({
        provider_id:providerId, user_id:S.user.id, plan_code:plan.code,
        amount:plan.price, payment_method:method, reference_code:ref
      });
      if (error) { $('p_go').disabled = false; return toast('Oluşturulamadı: ' + error.message); }
      $('view').innerHTML = `<div class="card"><h2>Talebin alındı ✅</h2>
        <p>Ödeme açıklamasına şu referans kodunu yaz:</p>
        <p class="ref">${ref}</p>
        <div class="tr"><span>Paket</span><b>${esc(plan.name)}</b></div>
        <div class="tr"><span>Tutar</span><b>${tl(plan.price)}</b></div>
        <p class="muted" style="margin-top:8px">Ödemen hesaba geçtikten sonra paketin aktifleşir ve ${plan.duration_days} gün boyunca listelerde üst sırada çıkarsın.</p></div>
        <button class="btn" onclick="go('plans','${providerId}')">Paketlerime dön</button>`;
    };
  },

  async admin(tab){
    tab = tab || 'biz';
    header('Yönetim paneli');
    if (S.role !== 'admin') { $('view').innerHTML = `<div class="empty">Bu sayfaya erişim yetkin yok.</div>`; return; }
    $('view').innerHTML = `<p class="muted">Yükleniyor…</p>`;
    const { data:st, error:se } = await db.rpc('admin_stats');
    if (se) { $('view').innerHTML = `<div class="empty">${esc(se.message)}</div>`; return; }
    const top = `<div class="stat">
        <div><b>${st.users}</b><span class="muted">Kullanıcı</span></div>
        <div><b>${st.providers}</b><span class="muted">İşletme (${st.verified} onaylı)</span></div>
        <div><b>${st.jobs}</b><span class="muted">Talep (7 günde ${st.jobs_7d})</span></div>
        <div><b>${st.open_reports}</b><span class="muted">Açık şikayet</span></div>
        <div><b>${st.pending_payments}</b><span class="muted">Bekleyen ödeme</span></div>
        <div><b>${tl(st.revenue_30d)}</b><span class="muted">30 günlük gelir (${st.active_plans} aktif paket)</span></div>
      </div>
      <div class="tabs"><button class="${tab==='biz'?'on':''}" onclick="go('admin','biz',false)">İşletmeler</button><button class="${tab==='rep'?'on':''}" onclick="go('admin','rep',false)">Şikayetler</button><button class="${tab==='pay'?'on':''}" onclick="go('admin','pay',false)">Ödemeler</button></div>`;
    if (tab === 'biz') {
      $('view').innerHTML = top + `<input class="in" id="aq" placeholder="İşletme veya şehir ara"><div id="alist" style="margin-top:10px"></div>`;
      const load = async () => {
        const q = $('aq').value.trim().replace(/[%,()]/g, '');
        let query = db.from('providers').select('id,business_name,city,district,phone,is_verified,is_premium,is_active,rating_avg,rating_count,created_at').order('created_at', { ascending:false }).limit(50);
        if (q) query = query.or(`business_name.ilike.%${q}%,city.ilike.%${q}%`);
        const { data, error } = await query;
        if (error) { $('alist').innerHTML = esc(error.message); return; }
        $('alist').innerHTML = data.length ? data.map(b => `<div class="card">
          <div class="row"><b>${esc(b.business_name)}</b><span class="muted">★ ${Number(b.rating_avg).toFixed(1)} (${b.rating_count})</span></div>
          <div class="muted">${esc([b.district, b.city].filter(Boolean).join(', '))} · ${esc(b.phone)} · ${new Date(b.created_at).toLocaleDateString('tr-TR')}</div>
          <div class="checks" style="margin-top:8px">
            <button class="chk ${b.is_verified?'on':''}" onclick="adminSet('${b.id}','is_verified',${!b.is_verified})">✔ Onaylı</button>
            <button class="chk ${b.is_premium?'on':''}" onclick="adminSet('${b.id}','is_premium',${!b.is_premium})">⭐ Premium</button>
            <button class="chk ${b.is_active?'':'on'}" onclick="adminSet('${b.id}','is_active',${!b.is_active})">🚫 Gizli</button>
            <button class="chk" onclick="go('pro','${b.id}')">👁️ Profil</button>
          </div></div>`).join('') : '<div class="empty">Sonuç yok</div>';
      };
      window.adminSet = async (id, field, value) => {
        const { error } = await db.from('providers').update({ [field]: value }).eq('id', id);
        error ? toast(error.message) : (toast('Güncellendi'), load());
      };
      let t; $('aq').oninput = () => { clearTimeout(t); t = setTimeout(load, 400); };
      load();
    } else if (tab === 'pay') {
      const { data, error } = await db.from('subscriptions')
        .select('id,plan_code,amount,payment_method,status,reference_code,created_at,ends_at,providers(business_name,phone,city)')
        .order('created_at', { ascending:false }).limit(100);
      if (error) { $('view').innerHTML = top + `<div class="empty">${esc(error.message)}</div>`; return; }
      const { data:st2 } = await db.from('payment_settings').select('*').eq('id', true).single();
      const MM = {havale:'Havale', eft:'EFT', banka_karti:'Banka kartı', kredi_karti:'Kredi kartı'};
      const SM = {pending:'Bekliyor', active:'Aktif', rejected:'Reddedildi', cancelled:'İptal', expired:'Süresi doldu'};
      $('view').innerHTML = top + `
        <div class="card"><b>🏦 Havale / EFT hesap bilgileri</b><p class="muted">Ustalara ödeme ekranında gösterilir.</p>
          <label>Ünvan</label><input class="in" id="ps_acc" value="${esc(st2?.account_name)}">
          <label>Banka</label><input class="in" id="ps_bank" value="${esc(st2?.bank_name)}">
          <label>IBAN</label><input class="in" id="ps_iban" value="${esc(st2?.iban)}">
          <label>Açıklama / not</label><textarea class="in" id="ps_note" rows="2">${esc(st2?.instructions)}</textarea>
          <div class="checks" style="margin-top:8px"><button class="chk ${st2?.card_enabled?'on':''}" id="ps_card">💳 Kartla ödeme aktif</button></div>
          <button class="btn" id="ps_save">Kaydet</button></div>
        <button class="btn alt" id="exp_go">🧹 Süresi dolan paketleri temizle</button>
        <h2>Ödeme talepleri</h2>
        ${data.length ? data.map(s => `<div class="card">
          <div class="row"><b>${esc(s.providers?.business_name || '—')}</b><span class="badge ${s.status==='pending'?'warn':''}">${SM[s.status]||s.status}</span></div>
          <div class="muted">${esc(S.plans?.find(x=>x.code===s.plan_code)?.name || s.plan_code)} · ${tl(s.amount)} · ${MM[s.payment_method]||s.payment_method}</div>
          <div class="muted">Referans: <span class="ref">${esc(s.reference_code)}</span> · ${new Date(s.created_at).toLocaleString('tr-TR')}</div>
          <div class="muted">${esc(s.providers?.city)} · ${esc(s.providers?.phone)}</div>
          ${s.status==='active' && s.ends_at ? `<div class="muted">Bitiş: ${new Date(s.ends_at).toLocaleDateString('tr-TR')}</div>` : ''}
          ${s.status==='pending' ? `<div class="checks" style="margin-top:8px"><button class="chk" onclick="subSet('${s.id}','active')">✅ Ödeme geldi, aktifleştir</button><button class="chk" onclick="subSet('${s.id}','rejected')">✖ Reddet</button></div>` : ''}
          ${s.status==='active' ? `<div class="checks" style="margin-top:8px"><button class="chk" onclick="subSet('${s.id}','cancelled')">⛔ İptal et</button></div>` : ''}
        </div>`).join('') : '<div class="empty">Ödeme talebi yok</div>'}`;
      if (!S.plans) db.from('plans').select('*').then(r => { S.plans = r.data || []; });
      $('ps_card').onclick = e => e.currentTarget.classList.toggle('on');
      $('ps_save').onclick = async () => {
        const { error } = await db.from('payment_settings').update({
          account_name:$('ps_acc').value.trim() || null, bank_name:$('ps_bank').value.trim() || null,
          iban:$('ps_iban').value.trim().toUpperCase() || null, instructions:$('ps_note').value.trim() || null,
          card_enabled:$('ps_card').classList.contains('on'), updated_at:new Date().toISOString()
        }).eq('id', true);
        error ? toast(error.message) : toast('Ödeme bilgileri kaydedildi');
      };
      $('exp_go').onclick = async () => {
        const { data:n, error } = await db.rpc('expire_subscriptions');
        error ? toast(error.message) : toast((n || 0) + ' paket süresi doldu olarak işaretlendi');
        go('admin', 'pay', false);
      };
      window.subSet = async (id, status) => {
        if (status === 'active' && !confirm('Ödeme hesaba geçti mi? Paket hemen aktifleşecek.')) return;
        const { error } = await db.from('subscriptions').update({ status }).eq('id', id);
        error ? toast(error.message) : go('admin', 'pay', false);
      };
    } else {
      const { data, error } = await db.from('reports').select('id,reason,status,created_at,provider_id,providers(business_name,is_active)').order('created_at', { ascending:false }).limit(100);
      if (error) { $('view').innerHTML = top + `<div class="empty">${esc(error.message)}</div>`; return; }
      $('view').innerHTML = top + (data.length ? data.map(r => `<div class="card">
          <div class="row"><b>${esc(r.providers?.business_name || 'Silinmiş işletme')}</b><span class="badge ${r.status==='open'?'warn':''}">${r.status==='open'?'Açık':'Kapalı'}</span></div>
          <div class="muted">${new Date(r.created_at).toLocaleString('tr-TR')}</div>
          <div>${esc(r.reason)}</div>
          <div class="checks" style="margin-top:8px">
            ${r.status==='open' ? `<button class="chk" onclick="reportClose('${r.id}')">✔ Kapat</button>` : ''}
            ${r.providers?.is_active ? `<button class="chk" onclick="reportHide('${r.provider_id}','${r.id}')">🚫 İşletmeyi gizle</button>` : ''}
            <button class="chk" onclick="go('pro','${r.provider_id}')">👁️ Profil</button>
          </div></div>`).join('') : '<div class="empty">Şikayet yok 🎉</div>');
      window.reportClose = async id => { const { error } = await db.from('reports').update({ status:'closed' }).eq('id', id); error ? toast(error.message) : go('admin', 'rep', false); };
      window.reportHide = async (pid, rid) => {
        if (!confirm('İşletme listelerden gizlensin mi?')) return;
        const { error } = await db.from('providers').update({ is_active:false }).eq('id', pid);
        if (error) return toast(error.message);
        await db.from('reports').update({ status:'closed' }).eq('id', rid);
        go('admin', 'rep', false);
      };
    }
  },

  legal(type){
    const L = {
      terms: ['Kullanım koşulları', `
        <p><b>Taslak metindir.</b> Yayına almadan önce bir hukukçuya kontrol ettirilmelidir.</p>
        <p>Arızamatik, kullanıcıları araç ve ev arızaları için hizmet veren işletmelerle buluşturan bir aracı platformdur. Hizmetin kendisi (tamir, çekme, montaj vb.) işletmeler tarafından verilir; işin kalitesi, fiyatı, garantisi ve ödemesi kullanıcı ile işletme arasındadır.</p>
        <ul>
          <li>Uygulamadaki ön yönlendirmeler ve güvenlik ipuçları bilgilendirme amaçlıdır, uzman teşhisi yerine geçmez. Tehlike anında 112, doğalgaz kokusunda 187 aranmalıdır.</li>
          <li>İşletmeler, girdikleri bilgi ve fiyatların doğru ve güncel olmasından sorumludur.</li>
          <li>Sahte kayıt, yanıltıcı yorum, kaba veya yasa dışı içerik yasaktır; bu hesaplar uyarı yapılmadan gizlenebilir veya kapatılabilir.</li>
          <li>Yorumlar yalnızca tamamlanan işler için yazılabilir ve gerçek deneyimi yansıtmalıdır.</li>
          <li>Arızamatik bu koşulları güncelleyebilir; önemli değişiklikler uygulamada duyurulur.</li>
        </ul>`],
      kvkk: ['KVKK aydınlatma metni', `
        <p><b>Taslak metindir.</b> Yayına almadan önce bir hukukçuya kontrol ettirilmeli ve veri sorumlusu bilgileri doldurulmalıdır.</p>
        <p><b>Veri sorumlusu:</b> [Şirket / işletme adı, adres, iletişim e-postası]</p>
        <p><b>İşlenen veriler:</b> Ad soyad, e-posta, telefon; konum bilgisi (izin verirsen); araç ve cihaz kayıtları; iş talepleri, mesajlar, yorumlar ve yüklediğin fotoğraflar; işletmeler için işletme, adres ve fiyat bilgileri.</p>
        <p><b>Amaç:</b> Sana en yakın ve uygun işletmeleri göstermek, taleplerini işletmeye iletmek, mesajlaşmayı sağlamak, bakım hatırlatmaları yapmak, güvenliği sağlamak ve şikayetleri incelemek.</p>
        <p><b>Aktarım:</b> Talep oluşturduğunda ilgili bilgiler seçtiğin işletmeyle paylaşılır. Veriler, hizmet aldığımız bulut altyapı sağlayıcılarında saklanabilir; bu sağlayıcılar yurt dışında olabilir.</p>
        <p><b>Hukuki sebep:</b> Sözleşmenin kurulması ve ifası, meşru menfaat ve gerekli hallerde açık rıza.</p>
        <p><b>Hakların:</b> KVKK 11. madde kapsamında verilerine erişme, düzeltme, silinmesini isteme ve itiraz etme hakkın vardır. Başvuru için: [iletişim e-postası]</p>`]
    }[type] || ['Bilgi', ''];
    header(L[0]);
    $('view').innerHTML = `<div class="legal card">${L[1]}</div>`;

  login(){
    header('Giriş yap');
    $('view').innerHTML = `
      <label>E-posta</label><input class="in" id="l_mail" type="email" autocomplete="email">
      <label>Şifre (en az 6 karakter)</label><input class="in" id="l_pass" type="password" autocomplete="current-password">
      <div id="nameWrap" style="display:none">
        <label>Hesap türü</label>
        <div class="seg" style="background:var(--soft)"><button class="on" id="t_user" style="color:var(--ink)">👤 Kullanıcı</button><button id="t_biz" style="color:var(--ink)">🔧 İşletme / usta</button></div>
        <div class="tip" id="t_info">Kullanıcı hesabı tamamen ücretsizdir: arıza sor, usta bul, çekici çağır.</div>
        <label>Ad soyad</label><input class="in" id="l_name">
        <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="l_ok" style="margin-top:4px">
        <span><button class="linkbtn" onclick="go('legal','terms')">Kullanım koşullarını</button> ve <button class="linkbtn" onclick="go('legal','kvkk')">KVKK aydınlatma metnini</button> okudum, kabul ediyorum.</span></label></div>
      <button class="btn" id="l_go">Giriş yap</button>
      <button class="btn alt" id="l_sw">Hesabın yok mu? Kayıt ol</button>`;
    let signup = false, accountType = 'user';
    $('t_user').onclick = () => { accountType = 'user'; $('t_user').classList.add('on'); $('t_biz').classList.remove('on'); $('t_info').textContent = 'Kullanıcı hesabı tamamen ücretsizdir: arıza sor, usta bul, çekici çağır.'; };
    $('t_biz').onclick = () => { accountType = 'provider'; $('t_biz').classList.add('on'); $('t_user').classList.remove('on'); $('t_info').textContent = 'İşletme hesabı: kaydolduktan sonra işletmeni ekler, ilan paketlerinden birini seçerek listelerde üst sıralarda çıkarsın.'; };
    $('l_sw').onclick = () => { signup=!signup; $('nameWrap').style.display=signup?'block':'none'; $('l_go').textContent=signup?'Kayıt ol':'Giriş yap'; $('l_sw').textContent=signup?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol'; };
    $('l_go').onclick = async () => {
      const email=$('l_mail').value.trim(), password=$('l_pass').value;
      if (!email || password.length < 6) return toast('E-posta ve en az 6 karakterlik şifre gir');
      if (signup && !$('l_ok').checked) return toast('Devam etmek için koşulları kabul etmelisin');
      const res = signup
        ? await db.auth.signUp({ email, password, options:{ data:{ full_name:$('l_name').value.trim(), account_type:accountType } } })
        : await db.auth.signInWithPassword({ email, password });
      if (res.error) return toast(res.error.message.includes('Invalid login') ? 'E-posta veya şifre hatalı' : res.error.message);
      if (signup && !res.data.session) return toast('E-postana gelen doğrulama linkine tıkla, sonra giriş yap');
      S.user = res.data.user; await loadRole();
      if (signup && accountType === 'provider') { toast('Hoş geldin! Şimdi işletmeni ekleyelim'); S.stack=[]; return go('addBiz', null, false); }
      toast('Hoş geldin!'); back();
    };
  },

  async account(){
    header();
    if (!S.user) { $('view').innerHTML = `<div class="empty">Giriş yaparak talep oluşturabilir, işletmeni ekleyebilirsin.</div><button class="btn" onclick="go('login')">Giriş yap / Kayıt ol</button>`; return; }
    const { data:mine } = await db.from('providers').select('id,business_name,plan_code,plan_ends_at').eq('owner_id', S.user.id);
    $('view').innerHTML = `
      <h2>Hesabım</h2><div class="card"><div class="muted">E-posta</div><b>${esc(S.user.email)}</b></div>
      <h2>İşletmelerim</h2>
      ${(mine||[]).map(b=>`<button class="card pro" onclick="go('bizEdit','${b.id}')"><div class="av">${esc(b.business_name[0])}</div><div style="align-self:center"><b>${esc(b.business_name)}</b><div class="muted">${new Date(b.plan_ends_at||0) > new Date() ? '⭐ ' + (b.plan_code==='yearly'?'Yıllık':b.plan_code==='monthly'?'Aylık':'Haftalık') + ' paket aktif' : '✏️ Usta panelini aç'}</div></div></button>`).join('') || '<p class="muted">Kayıtlı işletmen yok.</p>'}
      ${(mine||[]).length ? `<button class="btn" onclick="go('plans','${mine[0].id}')">⭐ İlan paketleri</button>` : ''}
      <button class="btn alt" onclick="go('addBiz')">+ İşletme ekle</button>
      <button class="btn alt" onclick="go('garage')">🔔 Garaj & Ev</button>
      ${S.role==='admin' ? `<button class="btn" onclick="go('admin')">🛡️ Yönetim paneli</button>` : ''}
      <div class="row" style="justify-content:center;gap:16px;margin-top:10px"><button class="linkbtn" onclick="go('legal','terms')">Kullanım koşulları</button><button class="linkbtn" onclick="go('legal','kvkk')">KVKK aydınlatma metni</button></div>
      <button class="btn red" onclick="db.auth.signOut().then(()=>go('home',null,false))">Çıkış yap</button>`;
  }
};

/* ---------- Yardimcilar ---------- */
function diagnose(){
  const text = $('q').value.toLocaleLowerCase('tr-TR').trim();
  if (!text) return $('q').focus();
  const r = RULES.find(x => x.k.some(k => text.includes(k)));
  if (!r) { $('dg').innerHTML = `<div class="tip" style="color:var(--ink)">Biraz daha detay yaz (hangi parça/cihaz, ses, koku, ışık) ya da aşağıdan kategori seç.</div>`; return; }
  const c = catBySlug(r.slug);
  $('dg').innerHTML = `<div class="card" style="margin-top:10px;color:var(--ink)"><b>${esc(r.t)}</b><div class="tip">⚠️ ${esc(r.tip)}</div>
    <button class="btn" onclick="go('list','${r.slug}')">${esc(c?.name||'Ustaları')} ustalarını gör</button>
    <p class="muted" style="margin-top:6px">Bu bir ön yönlendirmedir, kesin tespiti usta yapar.</p></div>`;
}
const FREE_PLAN = { code:'free', name:'Ücretsiz üyelik', rank:0, photo_limit:4, category_limit:2, price_limit:5, has_campaign:false, has_stats:false, has_whatsapp:false, featured_home:false };
function planOf(p){
  const active = p && p.plan_code && p.plan_ends_at && new Date(p.plan_ends_at) > new Date();
  if (!active) return FREE_PLAN;
  return (S.plans || []).find(x => x.code === p.plan_code) || FREE_PLAN;
}
async function loadPlans(){
  if (S.plans) return S.plans;
  const { data } = await db.from('plans').select('*').order('sort_order');
  S.plans = data || [];
  return S.plans;
}
function photoLimit(p){ return planOf(p).photo_limit || 4; }
function planBanner(p){
  const pl = planOf(p);
  if (pl.code === 'free') return `<div class="tip">Şu an ücretsiz üyesin: 4 fotoğraf, 5 fiyat satırı, 2 kategori ve listede paketlilerin altında sıra. <button class="linkbtn" onclick="go('plans','${p.id}')">Paketleri gör</button></div>`;
  const left = Math.max(0, Math.ceil((new Date(p.plan_ends_at) - new Date()) / 86400000));
  return `<div class="tip">⭐ <b>${esc(pl.name)}</b> aktif · ${left} gün kaldı <button class="linkbtn" onclick="go('plans','${p.id}')">Paketler</button></div>`;
}
const HOME_KINDS = {
  kombi:{name:'Kombi / doğalgaz', icon:'🔥', slug:'kombi'},
  klima:{name:'Klima', icon:'❄️', slug:'klima'},
  'beyaz-esya':{name:'Beyaz eşya', icon:'🧺', slug:'beyaz-esya'},
  'su-tesisat':{name:'Su tesisatı / termosifon', icon:'🚰', slug:'su-tesisat'},
  elektrik:{name:'Elektrik', icon:'💡', slug:'elektrik'},
  diger:{name:'Diğer', icon:'🏠', slug:null}
};
async function compressImage(file, max = 1280){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Görsel açılamadı')); i.src = URL.createObjectURL(file); });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Görsel işlenemedi')), 'image/jpeg', 0.8));
}
async function uploadPhoto(file){
  const blob = await compressImage(file);
  const path = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await db.storage.from('photos').upload(path, blob, { contentType:'image/jpeg' });
  if (error) throw error;
  return { path, url: db.storage.from('photos').getPublicUrl(path).data.publicUrl };
}
async function loadRole(){
  if (!S.user) { S.role = 'user'; return; }
  const { data } = await db.from('profiles').select('role').eq('id', S.user.id).single();
  S.role = data?.role || 'user';
}
function daysLeft(d){
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(d + 'T00:00:00') - t) / 86400000);
}
function dueBadge(d){
  const n = daysLeft(d);
  if (n === null) return '<span class="muted">Girilmedi</span>';
  const date = new Date(d + 'T00:00:00').toLocaleDateString('tr-TR');
  if (n < 0) return `<span class="badge bad">Süresi geçti · ${date}</span>`;
  if (n <= 30) return `<span class="badge warn">${n} gün kaldı · ${date}</span>`;
  return `<span class="muted">${date}</span>`;
}
async function loadFeatured(){
  if (!$('feat')) return;
  await getLocation();
  if (!S.locOk || !$('feat')) return;
  const { data } = await db.rpc('featured_providers', { lat:S.lat, lng:S.lng });
  if (!data || !data.length || !$('feat')) return;
  $('feat').innerHTML = `<h2>⭐ Öne çıkanlar</h2><div class="feat">${data.map(f => `<button class="card" onclick="go('pro','${f.id}')" style="text-align:left">
    <b>${esc(f.business_name)}</b>
    <div class="muted">${f.distance_km.toFixed(1)} km · ★ ${Number(f.rating_avg).toFixed(1)} (${f.rating_count})</div>
    ${f.campaign ? `<div class="camp">${esc(f.campaign)}</div>` : ''}</button>`).join('')}</div>`;
}
async function loadReminders(){
  if (!S.user || !$('rem')) return;
  const [{ data:cars }, { data:homes }] = await Promise.all([
    db.from('vehicles').select('brand,model,inspection_date,insurance_date'),
    db.from('home_items').select('name,next_service_date,warranty_end')
  ]);
  const items = [];
  const push = (label, what, d) => { const n = daysLeft(d); if (n !== null && n <= 30) items.push(`${label}: ${what} ${n < 0 ? 'süresi geçti' : n + ' gün kaldı'}`); };
  (cars || []).forEach(v => { const l = `${esc(v.brand)} ${esc(v.model)}`; push(l, 'Muayene', v.inspection_date); push(l, 'Sigorta', v.insurance_date); });
  (homes || []).forEach(h => { const l = esc(h.name); push(l, 'Bakım', h.next_service_date); push(l, 'Garanti', h.warranty_end); });
  if (items.length && $('rem')) $('rem').innerHTML = `<button class="card" style="display:block;width:100%;text-align:left;border-left:6px solid var(--amber)" onclick="go('garage')"><b>🔔 Hatırlatma</b>${items.map(i => `<div class="muted">${i}</div>`).join('')}</button>`;
}
function getLocation(){
  return new Promise(res => {
    if (!navigator.geolocation) return res();
    navigator.geolocation.getCurrentPosition(
      p => { S.lat=p.coords.latitude; S.lng=p.coords.longitude; S.locOk=true; res(); },
      () => res(), { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
  });
}

/* ---------- Baslat ---------- */
(async function init(){
  if (!configured) {
    header(); $('view').innerHTML = `<div class="card"><h2>Kurulum eksik</h2><p>index.html dosyasının içinde <b>BURAYA_PROJECT_URL</b> ve <b>BURAYA_ANON_KEY</b> yazan yerlere Supabase bilgilerini yapıştır.</p></div>`;
    return;
  }
  const { data:{ session } } = await db.auth.getSession();
  S.user = session?.user || null;
  await loadRole();
  db.auth.onAuthStateChange((_e, s) => { const changed = (s?.user?.id || null) !== (S.user?.id || null); S.user = s?.user || null; if (changed) setTimeout(loadRole, 0); });
  go('home', null, false);
  const { data } = await db.from('categories').select('*').order('sort_order');
  S.cats = data || [];
  if (S.cur?.name === 'home') go('home', null, false);
  getLocation().then(() => { if (S.cur?.name === 'home') header(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
